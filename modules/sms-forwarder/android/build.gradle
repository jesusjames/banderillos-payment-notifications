plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.banderillos.smsforwarder'
version = '0.1.0'

android {
  namespace "com.banderillos.smsforwarder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Cola de envíos con restricción de red y reintentos.
  implementation "androidx.work:work-runtime-ktx:2.11.2"
}
